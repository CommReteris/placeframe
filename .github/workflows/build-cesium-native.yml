# Build Cesium for Unity native plugin for Linux and publish to npmjs.org.
#
# Rebuild triggers:
#   - Cesium version bump: change the cesium-version input
#   - Unity version bump: update the container image tag and unity-version default
#   - Linux platform fixes in Cesium upstream
#
# Normally workflow_dispatch only — Cesium version bumps are rare and the build
# takes 30-60 minutes cold (5-10 minutes with cache).
# TODO: Remove push trigger before merging to main.

name: Cesium Native Linux

#
on:
  push:
    branches:
      - feature/upm-packages
    paths-ignore: [".env.lock"]
  workflow_dispatch:
    inputs:
      cesium-version:
        description: "Cesium for Unity git tag to build"
        required: true
        default: "v1.15.3"

env:
  ORAS_VERSION: "1.2.2"
  CACHE_REGISTRY: ghcr.io/${{ github.repository }}/cache
  CESIUM_VERSION: ${{ inputs.cesium-version || 'v1.15.3' }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    container:
      image: unityci/editor:6000.0.66f1-linux-il2cpp-3
      volumes:
        - /usr/local/lib/android:/to_clean/android
        - /usr/share/dotnet:/to_clean/dotnet
        - /opt/hostedtoolcache:/to_clean/toolcache
        - /usr/local/.ghcup:/to_clean/ghcup
        - /usr/share/swift:/to_clean/swift

    steps:
      - name: Free Disk Space
        run: |
          rm -rf /to_clean/android/* /to_clean/dotnet/* /to_clean/toolcache/* /to_clean/ghcup/* /to_clean/swift/*
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Activate Unity License
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if ! unity-editor -batchmode -nographics -quit \
            -serial "$UNITY_SERIAL" \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" \
            -logFile /dev/stdout; then
            echo "::error::Unity license activation failed — check seat availability and credentials"
            echo "### Unity license activation failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Check seat availability (2-seat serial limit) and credential validity." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq cmake ninja-build nasm g++ zip unzip curl pkg-config zstd > /dev/null

      - name: Install ORAS
        run: |
          curl -sLO "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          tar -xzf "oras_${ORAS_VERSION}_linux_amd64.tar.gz" -C /usr/local/bin/ oras
          rm "oras_${ORAS_VERSION}_linux_amd64.tar.gz"

      - name: Login to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: "Phase 1: Clone repos"
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: uv run build-cesium-native-linux --cesium-version ${{ env.CESIUM_VERSION }} --phase clone

      - name: Restore codegen cache
        id: codegen-cache
        run: |
          PACKAGE="/tmp/cesium-build/cesium-unity-samples/Packages/com.cesium.unity"
          if oras pull "$CACHE_REGISTRY/cesium-codegen:${{ env.CESIUM_VERSION }}" -o /tmp/cache 2>/dev/null; then
            echo "Cache hit"
            tar -xf /tmp/cache/codegen.tar.zst -C "$PACKAGE"
            rm -rf /tmp/cache
            echo "cache-hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cache miss"
            echo "cache-hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Phase 2: Codegen (Reinterop, Unity code generation)"
        env:
          UNITY_EDITOR: unity-editor
          GIT_LFS_SKIP_SMUDGE: "1"
        run: uv run build-cesium-native-linux --cesium-version ${{ env.CESIUM_VERSION }} --phase codegen

      - name: Save codegen cache
        if: steps.codegen-cache.outputs.cache-hit == 'false'
        run: |
          PACKAGE="/tmp/cesium-build/cesium-unity-samples/Packages/com.cesium.unity"
          tar --zstd -cf codegen.tar.zst -C "$PACKAGE" \
            Reinterop.dll \
            $(cd "$PACKAGE" && find native~ -type d -name "generated-*" | sort)
          oras push "$CACHE_REGISTRY/cesium-codegen:${{ env.CESIUM_VERSION }}" \
            codegen.tar.zst:application/vnd.placeframe.cesium-codegen.v1+zstd
          rm codegen.tar.zst

      - name: Restore vcpkg cache
        id: vcpkg-cache
        run: |
          if oras pull "$CACHE_REGISTRY/cesium-vcpkg:${{ env.CESIUM_VERSION }}" -o /tmp/cache 2>/dev/null; then
            echo "Cache hit"
            tar -xf /tmp/cache/vcpkg-cache.tar.zst -C /
            rm -rf /tmp/cache
            echo "cache-hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "Cache miss"
            echo "cache-hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "Phase 3: Native build (cmake Editor + Standalone)"
        env:
          UNITY_EDITOR: unity-editor
          GIT_LFS_SKIP_SMUDGE: "1"
        run: uv run build-cesium-native-linux --cesium-version ${{ env.CESIUM_VERSION }} --phase native-build

      - name: Save vcpkg cache
        if: steps.vcpkg-cache.outputs.cache-hit == 'false'
        run: |
          tar --zstd -cf vcpkg-cache.tar.zst \
            /tmp/cesium-build/cesium-unity-samples/Packages/com.cesium.unity/native~/build-Editor \
            /tmp/cesium-build/cesium-unity-samples/Packages/com.cesium.unity/native~/build-Standalone
          oras push "$CACHE_REGISTRY/cesium-vcpkg:${{ env.CESIUM_VERSION }}" \
            vcpkg-cache.tar.zst:application/vnd.placeframe.cesium-cache.v1+zstd
          rm vcpkg-cache.tar.zst

      - name: Copy Linux binaries into package
        run: |
          BUILD_PKG="/tmp/cesium-build/cesium-unity-samples/Packages/com.cesium.unity"
          REPO_PKG="packages/unity/com.cesium.unity"

          cp "$BUILD_PKG/Editor/libCesiumForUnityNative-Editor.so" "$REPO_PKG/Editor/"
          cp "$BUILD_PKG/Editor/libCesiumForUnityNative-Runtime.so" "$REPO_PKG/Editor/"
          cp "$BUILD_PKG/Plugins/Standalone/libCesiumForUnityNative-Runtime.so" "$REPO_PKG/Plugins/Standalone/"

          echo "Linux binaries:"
          find "$REPO_PKG" -name "*.so" -exec ls -lh {} \;

      - name: Download official Cesium release
        run: |
          VERSION="${CESIUM_VERSION#v}"
          curl -sL "https://github.com/CesiumGS/cesium-unity/releases/download/${CESIUM_VERSION}/com.cesium.unity-${VERSION}.tgz" \
            -o /tmp/cesium-official.tgz
          echo "Downloaded com.cesium.unity-${VERSION}.tgz"

      - name: Merge official binaries into package
        run: |
          REPO_PKG="packages/unity/com.cesium.unity"
          mkdir -p /tmp/cesium-official
          tar -xzf /tmp/cesium-official.tgz -C /tmp/cesium-official
          OFFICIAL="/tmp/cesium-official/package"

          # Editor: Windows DLLs
          cp "$OFFICIAL"/Editor/CesiumForUnityNative-Editor.dll "$REPO_PKG/Editor/"
          cp "$OFFICIAL"/Editor/CesiumForUnityNative-Editor.dll.meta "$REPO_PKG/Editor/"
          cp "$OFFICIAL"/Editor/CesiumForUnityNative-Runtime.dll "$REPO_PKG/Editor/"
          cp "$OFFICIAL"/Editor/CesiumForUnityNative-Runtime.dll.meta "$REPO_PKG/Editor/"

          # Editor: macOS dylibs (arm64 + x86_64 subdirectories)
          for arch in arm64 x86_64; do
            cp -r "$OFFICIAL/Editor/$arch" "$REPO_PKG/Editor/"
            cp "$OFFICIAL/Editor/$arch.meta" "$REPO_PKG/Editor/"
          done

          # Plugins/Standalone: Windows DLL + macOS dylib
          cp "$OFFICIAL"/Plugins/Standalone/CesiumForUnityNative-Runtime.dll "$REPO_PKG/Plugins/Standalone/"
          cp "$OFFICIAL"/Plugins/Standalone/CesiumForUnityNative-Runtime.dll.meta "$REPO_PKG/Plugins/Standalone/"
          cp "$OFFICIAL"/Plugins/Standalone/libCesiumForUnityNative-Runtime.dylib "$REPO_PKG/Plugins/Standalone/"
          cp "$OFFICIAL"/Plugins/Standalone/libCesiumForUnityNative-Runtime.dylib.meta "$REPO_PKG/Plugins/Standalone/"

          # Plugins/Android
          cp -r "$OFFICIAL/Plugins/Android" "$REPO_PKG/Plugins/"
          cp "$OFFICIAL/Plugins/Android.meta" "$REPO_PKG/Plugins/"

          # iOS and WSA excluded — iOS static libs push the package over npm's size limit,
          # WSA is unused. Can revisit if needed.

          echo "Multi-platform package contents (native binaries):"
          find "$REPO_PKG" \( -name "*.so" -o -name "*.dll" -o -name "*.dylib" \) -exec ls -lh {} \;

          rm -rf /tmp/cesium-official /tmp/cesium-official.tgz

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Publish to npmjs.org
        working-directory: packages/unity/com.cesium.unity
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version 2>/dev/null; then
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} already published, skipping"
          else
            npm publish --access public --provenance --tag latest
          fi

      - name: Return Unity License
        if: always()
        run: |
          unity-editor -batchmode -nographics -quit \
            -returnlicense \
            -logFile /dev/stdout || true
