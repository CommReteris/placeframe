name: Build

on:
  push:
    branches: [main, dev]
    paths-ignore: [".env.lock"]
  pull_request:
    branches: [main, dev]
    paths-ignore: [".env.lock"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      # Torch layers are huge; we need this step or we'll run out of disk space
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Setup UV
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/pyproject.toml
            **/uv.lock

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Base & CUDA Images"
          uv run build --mode ci --gpu cuda
          echo "::endgroup::"

          echo "::group::Cleanup"
          # Torch layers are huge; we need this step or we'll run out of disk space
          docker buildx prune --all --force --filter "type=exec.cachemount"
          docker system prune --all --force
          echo "::endgroup::"

          echo "::group::ROCm Images"
          uv run build --mode ci --gpu rocm
          echo "::endgroup::"

      - name: Commit and push .env.lock
        if: "!contains(fromJSON('[\"main\",\"dev\"]'), github.head_ref)"
        run: |
          if git diff --quiet .env.lock; then
            echo "No changes to .env.lock, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .env.lock
          git commit -m "Update .env.lock"
          git push
