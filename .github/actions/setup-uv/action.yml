name: Setup
description: Install uv and sync dependencies

inputs:
  save-cache:
    description: Whether to save the uv cache in the post step
    default: "false"

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        save-cache: ${{ inputs.save-cache }}

    - name: Sync dependencies
      shell: bash
      run: uv sync
