[project]
name = "scripts"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scripts"]

[project.scripts]
forward-unity-android-debug-port = "scripts.forward_unity_android_debug_port:main"
list-debug-targets = "scripts.list_debug_targets:main"
deploy-rig = "scripts.deploy_rig:app"
